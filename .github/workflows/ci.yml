name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      # Task 8 (checkpoint B): enable the benchmark gate at baseline minus 0.03, e.g.
      # - run: intenttrace generate --n 300 --seed 7
      # - run: intenttrace bench --provider fake --min-macro-f1 0.80 --max-false-accusation 0.05

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "exists=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.check.outputs.exists == 'true'
        run: cd web && npm ci && npm run build
