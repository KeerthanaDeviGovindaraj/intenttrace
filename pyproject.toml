[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "intenttrace"
version = "0.1.0"
description = "Forensic investigator for AI agent purchases: was a signed agent payment legitimate or manipulated?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Keerthana Devi Govindaraj" }]
keywords = ["agentic-commerce", "ap2", "ai-agents", "payments", "prompt-injection", "forensics", "mcp"]
dependencies = [
  "pydantic>=2.6",
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "mcp==2.3.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
intenttrace = "intenttrace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/intenttrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query"]
